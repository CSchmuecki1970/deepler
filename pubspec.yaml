name: deepler
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  pdf: ^3.10.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0

dev_dependencies:
